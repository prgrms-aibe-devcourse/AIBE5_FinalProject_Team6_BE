name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

jobs:
  deploy:
    # CI가 성공한 경우에만 배포
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 토큰 발급
      contents: read

    steps:
      - name: Checkout (CI를 통과한 커밋 기준)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v3

      - name: JAR 빌드 (테스트 생략 — CI에서 완료)
        run: ./gradlew :apps:api-server:bootJar --no-daemon

      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: JAR → S3 업로드
        run: |
          JAR=$(find apps/api-server/build/libs -name "*.jar" ! -name "*plain*" | head -1)
          echo "업로드 대상: $JAR"
          aws s3 cp "$JAR" s3://${{ secrets.S3_BUCKET }}/deploy/api-server.jar

      - name: 배포 스크립트 → S3 업로드
        run: |
          aws s3 cp .github/scripts/bluegreen-deploy.sh \
            s3://${{ secrets.S3_BUCKET }}/scripts/bluegreen-deploy.sh

      - name: Blue/Green 배포 (SSM RunCommand)
        run: |
          BUCKET="${{ secrets.S3_BUCKET }}"
          INSTANCE="${{ secrets.EC2_INSTANCE_ID }}"

          # SSM 명령 파라미터 파일 생성 (jq로 JSON 작성 — heredoc EOF 공백 문제 회피)
          jq -n --arg bucket "$BUCKET" '{
            commands: [
              "aws s3 cp s3://\($bucket)/scripts/bluegreen-deploy.sh /tmp/bluegreen-deploy.sh",
              "chmod +x /tmp/bluegreen-deploy.sh",
              "S3_BUCKET=\($bucket) /tmp/bluegreen-deploy.sh"
            ]
          }' > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # 완료 대기 (10초 간격, 최대 5분)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/30] 상태: $STATUS"
            [ "$STATUS" = "Success"   ] && break
            [ "$STATUS" = "Failed"    ] && { echo "배포 실패"; exit 1; }
            [ "$STATUS" = "Cancelled" ] && { echo "배포 취소됨"; exit 1; }
            sleep 10
          done

          [ "$STATUS" = "Success" ] || { echo "타임아웃"; exit 1; }

      - name: 배포 완료 알림
        if: success()
        run: |
          echo "✅ 배포 완료"
          echo "커밋: ${{ github.event.workflow_run.head_sha }}"
          echo "브랜치: develop"
