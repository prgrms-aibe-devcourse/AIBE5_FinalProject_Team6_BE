name: Setup CloudWatch Logs Agent

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'EC2에 CloudWatch Logs Agent를 설치합니다. 진행하려면 "yes" 입력'
        required: true
        default: 'no'

jobs:
  setup-cloudwatch:
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: CloudWatch 로그 그룹 생성 + 보관 기간 30일 설정
        run: |
          aws logs create-log-group \
            --log-group-name /fandrops/prod \
            --region ap-northeast-2 2>/dev/null || echo "로그 그룹 이미 존재"

          aws logs put-retention-policy \
            --log-group-name /fandrops/prod \
            --retention-in-days 30 \
            --region ap-northeast-2
          echo "로그 그룹 보관 기간: 30일 설정 완료"

      - name: 설정 파일 → S3 업로드
        run: |
          BUCKET="${{ secrets.S3_BUCKET }}"
          aws s3 cp infra/cloudwatch/amazon-cloudwatch-agent.json \
            "s3://$BUCKET/deploy/amazon-cloudwatch-agent.json"
          aws s3 cp infra/cloudwatch/rsyslog-fandrops.conf \
            "s3://$BUCKET/deploy/rsyslog-fandrops.conf"
          aws s3 cp infra/cloudwatch/logrotate-fandrops \
            "s3://$BUCKET/deploy/logrotate-fandrops"
          aws s3 cp infra/cloudwatch/journald-retention.conf \
            "s3://$BUCKET/deploy/journald-retention.conf"
          echo "S3 업로드 완료"

      - name: EC2 CloudWatch Agent 설치 및 설정 (SSM RunCommand)
        run: |
          INSTANCE="${{ secrets.EC2_INSTANCE_ID }}"
          BUCKET="${{ secrets.S3_BUCKET }}"

          COMMANDS=$(jq -n \
            --arg bucket "$BUCKET" \
            '[
              "echo \"=== [1/6] CloudWatch Agent 설치 ===\"",
              "dnf install -y amazon-cloudwatch-agent",

              "echo \"=== [2/6] 로그 디렉터리 생성 ===\"",
              "mkdir -p /var/log/fandrops",

              "echo \"=== [3/6] rsyslog 설치 + journald 전달 활성화 ===\"",
              "dnf install -y rsyslog",
              "mkdir -p /etc/systemd/journald.conf.d",
              "echo -e '[Journal]\\nForwardToSyslog=yes' > /etc/systemd/journald.conf.d/forward-syslog.conf",
              "systemctl restart systemd-journald",
              ("aws s3 cp s3://" + $bucket + "/deploy/rsyslog-fandrops.conf /etc/rsyslog.d/fandrops.conf"),
              "systemctl enable --now rsyslog",

              "echo \"=== [4/6] logrotate 설정 ===\"",
              ("aws s3 cp s3://" + $bucket + "/deploy/logrotate-fandrops /etc/logrotate.d/fandrops"),

              "echo \"=== [5/6] CloudWatch Agent 설정 및 시작 ===\"",
              ("aws s3 cp s3://" + $bucket + "/deploy/amazon-cloudwatch-agent.json /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json"),
              "/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json",

              "echo \"=== [6/6] journald 로컬 보관 기간 설정 ===\"",
              "mkdir -p /etc/systemd/journald.conf.d",
              ("aws s3 cp s3://" + $bucket + "/deploy/journald-retention.conf /etc/systemd/journald.conf.d/fandrops.conf"),
              "systemctl restart systemd-journald",

              "echo \"=== 완료 ===\"",
              "systemctl status amazon-cloudwatch-agent --no-pager"
            ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": $COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/30] 상태: $STATUS"
            [ "$STATUS" = "Success"   ] && break
            [ "$STATUS" = "Failed"    ] && {
              echo "설치 실패 — 에러 로그:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE" \
                --query "StandardErrorContent" --output text || true
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE" \
                --query "StandardOutputContent" --output text || true
              exit 1
            }
            [ "$STATUS" = "Cancelled" ] && { echo "취소됨"; exit 1; }
            sleep 10
          done

          [ "$STATUS" = "Success" ] || { echo "타임아웃"; exit 1; }

      - name: CloudWatch Agent 헬스체크
        run: |
          INSTANCE="${{ secrets.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["systemctl is-active amazon-cloudwatch-agent && echo CLOUDWATCH_OK"]}' \
            --query "Command.CommandId" \
            --output text)

          sleep 10

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE" \
            --query "Status" --output text 2>/dev/null || echo "Unknown")

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE" \
            --query "StandardOutputContent" --output text 2>/dev/null || true)

          echo "헬스체크 결과: $STATUS"
          echo "$OUTPUT"
          [ "$STATUS" = "Success" ] || { echo "CloudWatch Agent 확인 필요"; exit 1; }

      - name: 설치 완료
        run: |
          echo "✅ CloudWatch Logs Agent 설치 완료"
          echo ""
          echo "로그 그룹: /fandrops/prod (보관 30일)"
          echo "로컬 로그 파일: /var/log/fandrops/app.log (7일 logrotate)"
          echo "로컬 journal 보관: 7일"
          echo ""
          echo "AWS 콘솔 → CloudWatch → 로그 그룹 → /fandrops/prod 에서 확인하세요."
