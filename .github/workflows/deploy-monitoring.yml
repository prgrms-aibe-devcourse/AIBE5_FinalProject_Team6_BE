name: Deploy Monitoring

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'EC2에 Prometheus + Grafana를 배포합니다. 진행하려면 "yes" 입력'
        required: true
        default: 'no'

jobs:
  deploy-monitoring:
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 모니터링 파일 패키징 → S3 업로드
        run: |
          BUCKET="${{ secrets.S3_BUCKET }}"

          # ① 설정 파일 tarball
          tar -czf /tmp/monitoring.tar.gz \
            compose.monitoring.yml \
            infra/monitoring/
          aws s3 cp /tmp/monitoring.tar.gz "s3://$BUCKET/deploy/monitoring.tar.gz"

          # ② EC2에서 실행할 배포 스크립트
          cat > /tmp/deploy-monitoring.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          BUCKET="$1"

          echo "=== [1/4] Docker 설치 확인 ==="
          if ! command -v docker &>/dev/null; then
            echo "Docker 설치 중 (Amazon Linux 2023)..."
            dnf install -y docker docker-compose-plugin
            systemctl enable --now docker
            echo "Docker 설치 완료"
          else
            echo "Docker 이미 설치됨: $(docker --version)"
          fi

          # docker compose v2 플러그인 별도 확인 (docker만 있고 plugin 없을 수 있음)
          if ! docker compose version &>/dev/null 2>&1; then
            echo "docker-compose-plugin 설치 중..."
            dnf install -y docker-compose-plugin
            echo "docker-compose-plugin 설치 완료"
          else
            echo "docker compose 이미 설치됨: $(docker compose version)"
          fi

          usermod -aG docker ec2-user 2>/dev/null || true

          echo "=== [2/4] 설정 파일 다운로드 ==="
          aws s3 cp "s3://$BUCKET/deploy/monitoring.tar.gz" /tmp/monitoring.tar.gz

          echo "=== [3/4] 압축 해제 → /opt/fandrops-monitoring ==="
          mkdir -p /opt/fandrops-monitoring
          tar -xzf /tmp/monitoring.tar.gz -C /opt/fandrops-monitoring
          ls -la /opt/fandrops-monitoring/

          echo "=== [4/4] 모니터링 스택 실행 ==="
          cd /opt/fandrops-monitoring
          docker compose -f compose.monitoring.yml up -d --remove-orphans

          echo "=== 컨테이너 상태 ==="
          sleep 5
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          SCRIPT

          aws s3 cp /tmp/deploy-monitoring.sh "s3://$BUCKET/deploy/deploy-monitoring.sh"
          echo "S3 업로드 완료"

      - name: EC2 모니터링 배포 (SSM RunCommand)
        run: |
          INSTANCE="${{ secrets.EC2_INSTANCE_ID }}"
          BUCKET="${{ secrets.S3_BUCKET }}"

          # jq로 JSON 파라미터 안전하게 생성 (변수 포함)
          COMMANDS=$(jq -n \
            --arg bucket "$BUCKET" \
            '[
              ("aws s3 cp s3://" + $bucket + "/deploy/deploy-monitoring.sh /tmp/deploy-monitoring.sh"),
              "chmod +x /tmp/deploy-monitoring.sh",
              ("sudo /tmp/deploy-monitoring.sh " + $bucket)
            ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": $COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # 완료 대기 (10초 간격, 최대 6분 — Docker 설치 포함)
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/36] 상태: $STATUS"
            [ "$STATUS" = "Success"   ] && break
            [ "$STATUS" = "Failed"    ] && {
              echo "❌ 배포 실패 — 에러 로그:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE" \
                --query "StandardErrorContent" --output text || true
              echo "--- 표준 출력 ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE" \
                --query "StandardOutputContent" --output text || true
              exit 1
            }
            [ "$STATUS" = "Cancelled" ] && { echo "취소됨"; exit 1; }
            sleep 10
          done

          [ "$STATUS" = "Success" ] || { echo "타임아웃 (6분 초과)"; exit 1; }

      - name: Prometheus / Grafana 헬스체크
        run: |
          INSTANCE="${{ secrets.EC2_INSTANCE_ID }}"
          echo "컨테이너 기동 대기 (20초)..."
          sleep 20

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "curl -sf http://localhost:9090/-/healthy && echo PROMETHEUS_OK",
              "curl -sf http://localhost:3000/api/health | grep -q ok && echo GRAFANA_OK"
            ]}' \
            --query "Command.CommandId" \
            --output text)

          sleep 15

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE" \
            --query "Status" --output text 2>/dev/null || echo "Unknown")

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE" \
            --query "StandardOutputContent" --output text 2>/dev/null || true)

          echo "헬스체크 결과: $STATUS"
          echo "$OUTPUT"
          [ "$STATUS" = "Success" ] || { echo "헬스체크 실패 — 수동 확인 필요"; exit 1; }

      - name: 배포 완료
        run: |
          echo "✅ 모니터링 스택 배포 완료"
          echo ""
          echo "접속 URL (Security Group 포트 오픈 후):"
          echo "  Prometheus : http://<EC2-PUBLIC-IP>:9090"
          echo "  Grafana    : http://<EC2-PUBLIC-IP>:3000  (admin / admin)"
          echo ""
          echo "⚠️  EC2 Security Group에서 포트 9090, 3000 오픈이 필요합니다."
