name: Deploy Nginx Config

on:
  push:
    branches: [develop]
    paths:
      - 'nginx/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Nginx 설정 파일 → S3 업로드
        run: |
          aws s3 cp nginx/fandrops-zones.conf    s3://${{ secrets.S3_BUCKET }}/nginx/fandrops-zones.conf
          aws s3 cp nginx/fandrops-location.conf s3://${{ secrets.S3_BUCKET }}/nginx/fandrops-location.conf

      - name: EC2 Nginx 배포 (SSM RunCommand)
        run: |
          BUCKET="${{ secrets.S3_BUCKET }}"
          INSTANCE="${{ secrets.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws s3 cp s3://$BUCKET/nginx/fandrops-zones.conf    /tmp/fandrops-zones.conf\",
              \"aws s3 cp s3://$BUCKET/nginx/fandrops-location.conf /tmp/fandrops-location.conf\",
              \"sudo cp /tmp/fandrops-zones.conf    /etc/nginx/conf.d/fandrops-zones.conf\",
              \"sudo cp /tmp/fandrops-location.conf /etc/nginx/default.d/fandrops-location.conf\",
              \"sudo nginx -t\",
              \"sudo nginx -s reload\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/18] 상태: $STATUS"
            [ "$STATUS" = "Success"   ] && break
            [ "$STATUS" = "Failed"    ] && { echo "Nginx 배포 실패 — nginx -t 오류 또는 reload 실패"; exit 1; }
            [ "$STATUS" = "Cancelled" ] && { echo "배포 취소됨"; exit 1; }
            sleep 10
          done

          [ "$STATUS" = "Success" ] || { echo "타임아웃"; exit 1; }
          echo "Nginx 설정 배포 완료"
