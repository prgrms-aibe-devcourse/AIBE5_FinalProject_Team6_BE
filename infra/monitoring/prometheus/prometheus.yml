global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fandrops-api"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # host.docker.internal → 로컬(Mac/Windows)은 기본 지원
      # EC2(Linux)는 compose.monitoring.yml의 extra_hosts로 라우팅
      # blue(:8081) + green(:8082) 둘 다 등록 — 활성 슬롯만 UP, 비활성은 DOWN (무해)
      - targets: ["host.docker.internal:8081", "host.docker.internal:8082"]
        labels:
          application: "fandrops"