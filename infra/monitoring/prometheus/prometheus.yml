global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fandrops-api"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # host.docker.internal → 로컬(Mac/Windows)은 기본 지원
      # EC2(Linux)는 compose.monitoring.yml의 extra_hosts로 라우팅
      - targets: ["host.docker.internal:8081"]
        labels:
          application: "fandrops"