location / {
    proxy_pass http://fandrops_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_connect_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503;
}

location /actuator/health {
    proxy_pass http://fandrops_backend/actuator/health;
    proxy_set_header Host $host;
    access_log off;
}

location /api/v1/orders {
    limit_req zone=fandrops_order burst=10 nodelay;
    limit_req_status 429;
    add_header Retry-After 1 always;
    proxy_pass http://fandrops_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503;
}

location /api/v1/queue/join {
    limit_req zone=fandrops_queue burst=20 nodelay;
    limit_req_status 429;
    add_header Retry-After 1 always;
    proxy_pass http://fandrops_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503;
}

location /api/v1/payments/toss/confirm {
    limit_req zone=fandrops_payment burst=10 nodelay;
    limit_req_status 429;
    add_header Retry-After 1 always;
    proxy_pass http://fandrops_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503;
}

location /api/v1/queue/stream {
    limit_conn fandrops_sse 2100;
    limit_conn_status 429;
    add_header Retry-After 1 always;
    proxy_pass http://fandrops_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
