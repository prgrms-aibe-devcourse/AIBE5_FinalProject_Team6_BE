# 모니터링 Compose 오버라이드 (로컬 + EC2 공용)
# 기본 개발 환경(MySQL/Redis)과 분리해 필요할 때만 실행합니다.
#
# [로컬] 실행:
#   docker compose -f compose.yaml -f compose.monitoring.yml up -d
# [로컬] 중단:
#   docker compose -f compose.yaml -f compose.monitoring.yml down
#
# [EC2] 실행 (레포 루트에서):
#   docker compose -f compose.monitoring.yml up -d
# [EC2] 중단:
#   docker compose -f compose.monitoring.yml down

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Linux(EC2)에서 host.docker.internal → 호스트 머신으로 라우팅
      # Mac/Windows는 기본 지원되므로 이 설정이 있어도 무관
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.0.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=xxjyj1022@gmail.com
      - GF_SMTP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=xxjyj1022@gmail.com
      - GF_SMTP_FROM_NAME=FANDROPS Grafana
      - GF_SERVER_ROOT_URL=http://api.fandrops.site:3000
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana_data: