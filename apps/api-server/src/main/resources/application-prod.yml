# 운영 — Secret은 Secrets Manager / CI secret 만 (코드·레포에 금지)

spring:
  application:
    name: fandrops-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30

  flyway:
    baseline-on-migrate: true  # 기존 DB(ddl-auto로 생성된)에 Flyway 이력 테이블 없을 때 baseline 자동 생성
    baseline-version: 1        # V1 이하는 이미 적용된 것으로 간주하고 스킵

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD:}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true  # histogram_quantile(P95) 활성화
        lettuce.command.completion: true
  health:
    redis:
      enabled: true

toss:
  api:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY}
    connect-timeout: 3s
    read-timeout: ${TOSS_API_READ_TIMEOUT:10s}

fandrops:
  inventory:
    lock-strategy: optimistic
  mail:
    from: ${MAIL_FROM}
  ops:
    trace:
      response-header-enabled: true
  feature-flags:
    enabled: false
  queue:
    processing-timeout-seconds: 30
    waiting-timeout-seconds: 600
    advance-batch-size: 20
    max-concurrent-processing: 20
    scheduler:
      interval-ms: 1000
      heartbeat-ms: 5000
  s3:
    bucket: fandrops-prod-storage-495264909330-ap-northeast-2-an
    region: ap-northeast-2
    presigned-url-expiry-minutes: 10
    upload-prefix: uploads/banners
    upload-profile-image-prefix: uploads/profiles
