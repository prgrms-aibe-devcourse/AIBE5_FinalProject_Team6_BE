# 운영 — Secret은 Secrets Manager / CI secret 만 (코드·레포에 금지)

spring:
  application:
    name: fandrops-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD:}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true  # histogram_quantile(P95) 활성화
  health:
    redis:
      enabled: true

fandrops:
  ops:
    trace:
      response-header-enabled: true
  feature-flags:
    enabled: false
