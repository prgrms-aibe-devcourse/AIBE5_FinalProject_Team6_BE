# 공유 개발 환경 — Secret은 CI secret 또는 클라우드 Secrets Manager

spring:
  application:
    name: fandrops-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: true

fandrops:
  ops:
    trace:
      response-header-enabled: true
  feature-flags:
    enabled: false
