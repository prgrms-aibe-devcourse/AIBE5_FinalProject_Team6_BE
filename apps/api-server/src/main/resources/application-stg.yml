# 스테이징(테스트 전용) — prod에 가깝게, 실서비스 트래픽 금지

spring:
  application:
    name: fandrops-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true

fandrops:
  ops:
    trace:
      response-header-enabled: true
  feature-flags:
    enabled: false
  s3:
    # ⚠️ stg도 prod 버킷 사용 — 테스트 시 실제 S3에 파일이 올라갑니다
    bucket: fandrops-prod-storage-495264909330-ap-northeast-2-an
    region: ap-northeast-2
    presigned-url-expiry-minutes: 10
    upload-prefix: uploads/banners
    upload-profile-image-prefix: uploads/profiles
