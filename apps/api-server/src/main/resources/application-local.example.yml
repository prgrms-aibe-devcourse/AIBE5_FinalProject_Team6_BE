# =============================================================================
# 로컬 Secret / 연결 정보 예시 (커밋용 — 실제 값 넣지 마세요)
# =============================================================================
# 실제 값은 application-local.secrets.yml (gitignore) 에만 넣으세요.
# IDE Run Configuration → Environment variables 또는 OS 셸에 아래를 설정해도 됩니다.
#
# 1. DB (MySQL — docker compose up -d 후):
#   DB_URL=jdbc:mysql://localhost:3307/fandrops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
#   DB_USERNAME=fandrops
#   DB_PASSWORD=change-me
#
# 2. Redis (docker compose up -d 후):
#   REDIS_HOST=localhost
#   REDIS_PORT=6379
#
# 3. JWT:
#   JWT_SECRET=<base64-encoded-256bit-key>
#   # 운영 키 생성: openssl rand -base64 32
#
# 4. Google OAuth:
#   GOOGLE_CLIENT_ID=<Google Cloud Console에서 발급>
#   GOOGLE_CLIENT_SECRET=<Google Cloud Console에서 발급>
#   GOOGLE_REDIRECT_URI=http://localhost:3000/oauth/callback/google
#
# 5. 카카오 OAuth (발급 후 추가):
#   KAKAO_CLIENT_ID=<Kakao Developers에서 발급>
#   KAKAO_CLIENT_SECRET=<Kakao Developers에서 발급>
#   KAKAO_REDIRECT_URI=http://localhost:3000/oauth/callback/kakao
#
# 6. 이메일 (Gmail):
#   MAIL_USERNAME=fandropps@gmail.com
#   MAIL_PASSWORD=<Google 앱 비밀번호 16자리>
#   MAIL_FROM=fandropps@gmail.com
# =============================================================================
