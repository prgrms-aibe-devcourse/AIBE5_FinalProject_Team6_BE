# =============================================================================
# 로컬 개발 전용 설정 템플릿 (커밋용 — 실제 Secret 값은 넣지 마세요)
# 사용법: cp application-local.example.yml application-local.yml
# =============================================================================
#
# Secret은 IDE Run Configuration / 셸 환경 변수로 설정:
#   TOSS_SECRET_KEY=test_sk_xxxxxxxxxxxxxxxxxxxxxxxx
#
# MySQL 로컬 사용 시 (H2 대신):
#   DB_URL=jdbc:mysql://localhost:3307/fandrops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   DB_USERNAME=fandrops  DB_PASSWORD=change-me
#
# Redis 로컬 (docker compose up -d 후):
#   REDIS_HOST=localhost  REDIS_PORT=6379
#
# OAuth2 (필요 시 exclude 제거 후):
#   OAUTH2_CLIENT_ID=your-client-id  OAUTH2_CLIENT_SECRET=your-client-secret
# =============================================================================

spring:
  config:
    import: optional:application-local.override.yml

  application:
    name: fandrops-api

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  datasource:
    url: jdbc:h2:mem:fandrops;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false  # 로컬 H2: JPA ddl-auto 로 스키마 생성

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC

  h2:
    console:
      enabled: true
      path: /h2-console

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    redis:
      enabled: false

fandrops:
  ops:
    trace:
      response-header-enabled: true
  feature-flags:
    enabled: false
  order:
    payment-timeout: PT15M

toss:
  api:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY:}
    connect-timeout: 3s
    read-timeout: 10s