# =============================================================================
# 로컬 개발 전용 설정 템플릿 (커밋용 — 실제 Secret 값은 넣지 마세요)
# 사용법: cp application-local.example.yml application-local.yml
# =============================================================================
#
# Secret은 IDE Run Configuration / 셸 환경 변수로 설정:
#   TOSS_SECRET_KEY=test_sk_xxxxxxxxxxxxxxxxxxxxxxxx
#
#
# OAuth2 (필요 시 exclude 제거 후):
#   OAUTH2_CLIENT_ID=your-client-id  OAUTH2_CLIENT_SECRET=your-client-secret
# 실제 값은 application-local.secrets.yml (gitignore) 에만 넣으세요.
# IDE Run Configuration → Environment variables 또는 OS 셸에 아래를 설정해도 됩니다.
#
# 1. DB (MySQL — docker compose up -d 후):
#   DB_URL=jdbc:mysql://localhost:3307/fandrops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
#   DB_USERNAME=fandrops
#   DB_PASSWORD=change-me
#
# 2. Redis (docker compose up -d 후):
#   REDIS_HOST=localhost
#   REDIS_PORT=6379
#
# 3. JWT:
#   JWT_SECRET=<base64-encoded-256bit-key>
#   # 운영 키 생성: openssl rand -base64 32
#
# 4. Google OAuth:
#   GOOGLE_CLIENT_ID=<Google Cloud Console에서 발급>
#   GOOGLE_CLIENT_SECRET=<Google Cloud Console에서 발급>
#   GOOGLE_REDIRECT_URI=http://localhost:3000/oauth/callback/google
#
# 5. 카카오 OAuth (발급 후 추가):
#   KAKAO_CLIENT_ID=<Kakao Developers에서 발급>
#   KAKAO_CLIENT_SECRET=<Kakao Developers에서 발급>
#   KAKAO_REDIRECT_URI=http://localhost:3000/oauth/callback/kakao
#
# 6. 이메일 (Gmail):
#   MAIL_USERNAME=fandropps@gmail.com
#   MAIL_PASSWORD=<Google 앱 비밀번호 16자리>
#   MAIL_FROM=fandropps@gmail.com
# =============================================================================

spring:
  config:
    import: optional:application-local.override.yml

  application:
    name: fandrops-api

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  datasource:
    url: jdbc:h2:mem:fandrops;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false  # 로컬 H2: JPA ddl-auto 로 스키마 생성

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC

  h2:
    console:
      enabled: true
      path: /h2-console

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    redis:
      enabled: false

fandrops:
  ops:
    trace:
      response-header-enabled: true
  feature-flags:
    enabled: false
  order:
    payment-timeout: PT15M
  s3:
    # S3 버킷은 application-local.override.yml 에서 지정 (gitignore 대상)
    # override.yml 예시:
    #   fandrops:
    #     s3:
    #       bucket: <팀 슬랙 #dev-config 채널 참고>
    region: ap-northeast-2
    presigned-url-expiry-minutes: 10
    upload-prefix: uploads/banners
    upload-profile-image-prefix: uploads/profiles

toss:
  api:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY:}
    connect-timeout: 3s
    read-timeout: 10s