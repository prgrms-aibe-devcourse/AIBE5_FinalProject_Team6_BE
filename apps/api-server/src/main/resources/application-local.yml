# 로컬 개발 전용. Secret은 이 파일에 넣지 말고 IDE Run Configuration / 셸 환경 변수 사용.
# 예시: application-local.example.yml 참고 (.env 파일 사용 금지)

spring:
  config:
    import:
      - optional:application-local.override.yml
      - optional:application-local.secrets.yml

  application:
    name: fandrops-api

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  datasource:
    url: jdbc:h2:mem:fandrops;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false  # 로컬 H2: JPA ddl-auto 로 스키마 생성

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC

  h2:
    console:
      enabled: true
      path: /h2-console

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    redis:
      enabled: false

fandrops:
  ops:
    trace:
      response-header-enabled: true
  feature-flags:
    enabled: false
