spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

fandrops:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire-seconds: 1800
    refresh-token-expire-seconds: 604800
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth/callback/google}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    kakao:
      client-id: ${KAKAO_CLIENT_ID:placeholder}
      client-secret: ${KAKAO_CLIENT_SECRET:placeholder}
      redirect-uri: ${KAKAO_REDIRECT_URI:placeholder}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
  mail:
    from: ${MAIL_FROM:fandropps@gmail.com}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    password-reset-token-ttl-seconds: 1800
  ratelimit:
    order-per-minute: 10
    queue-join-per-minute: 5
    payment-per-minute: 10
    sse-max-emitters: 2000
    window-ms: 60000
